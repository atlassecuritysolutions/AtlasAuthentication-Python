[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-auth"
dynamic = ["version"]
description = "Atlas SDK - Python binding for Atlas.dll (Windows x64)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Atlas Security Solutions", email = "mail@atlassecurity.site" }]
keywords = ["authentication", "licensing", "hwid", "drm", "atlas"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage      = "https://atlassecurity.site"
Documentation = "https://atlassecurity.site/docs"
Dashboard     = "https://atlassecurity.site/dashboard"
Legal         = "https://atlassecurity.site/legal"
Repository    = "https://github.com/atlassecuritysolutions/AtlasAuthentication-Python"

# Static placeholder. The release pipeline rewrites the wheel's
# METADATA (atlas_auth-*.dist-info/METADATA) to the real SDK version
# at publish time, so `pip show atlas-auth` reports the right number
# on the consumer side. The placeholder stays "0.0.0" in source on
# purpose: a dev who yanks this SDK template into their own project
# should set version = "<their-app-version>" themselves. The real
# Atlas SDK version is read from the DLL via Atlas_Version() at
# runtime -- never from a string in this file or in atlas/__init__.py.
version = "0.0.0"

[tool.setuptools]
packages = ["atlas"]
include-package-data = true

[tool.setuptools.package-data]
atlas = ["py.typed"]

# Ship Atlas.dll + Atlas.c.h alongside the package. Wheel installs will
# place them next to `atlas/` so `_ffi.py`'s default lookup finds them.
[tool.setuptools.data-files]
"." = ["Atlas.dll", "Atlas.c.h"]

# Ship the install-hook setup.py inside the sdist via MANIFEST.in. Wheels
# already embed the hook into the install command.
